<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🥔 Potato Race!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a0a00;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── screen routing ── */
    .screen { display: none; }

    #setup-screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #3d1a00 0%, #1a0a00 70%);
      padding: 36px 16px 48px;
    }

    #race-screen.active {
      display: block;
      background: #0a1a0a;
      overflow-y: auto;
      min-height: 100vh;
    }

    #winner-screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #1a0a3d 0%, #1a0a00 70%);
      padding: 40px 16px 60px;
    }

    /* ── setup screen ── */
    .game-title {
      font-size: clamp(2rem, 6vw, 3.4rem);
      font-weight: 900;
      color: #FFD700;
      text-shadow: 3px 3px 8px rgba(0,0,0,.8);
      text-align: center;
      line-height: 1.2;
    }

    .game-subtitle {
      margin-top: 8px;
      font-size: 1rem;
      color: #CD853F;
      text-align: center;
    }

    .setup-box {
      margin-top: 30px;
      background: rgba(255,255,255,.05);
      border: 2px solid rgba(255,215,0,.25);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 540px;
    }

    .add-row {
      display: flex;
      gap: 10px;
    }

    .contestant-input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 8px;
      border: 2px solid rgba(255,215,0,.35);
      background: rgba(255,255,255,.09);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }
    .contestant-input::placeholder { color: rgba(255,255,255,.35); }
    .contestant-input:focus { border-color: #FFD700; }

    .btn-add {
      padding: 12px 18px;
      background: #FFD700;
      color: #1a0a00;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .1s, background .2s;
      white-space: nowrap;
    }
    .btn-add:hover { background: #FFC107; transform: translateY(-2px); }
    .btn-add:active { transform: translateY(0); }

    .error-msg {
      min-height: 20px;
      margin-top: 6px;
      font-size: .85rem;
      color: #FF6B6B;
    }

    .contestant-count {
      text-align: center;
      color: #CD853F;
      font-size: .88rem;
      margin: 6px 0 12px;
    }

    .contestant-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 360px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 2px;
    }

    .contestant-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,.07);
      border-radius: 8px;
      animation: slideIn .25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .color-dot {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,.3);
    }

    .contestant-label { flex: 1; font-size: .95rem; font-weight: 600; }

    .btn-remove {
      background: none;
      border: none;
      color: rgba(255,100,100,.65);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color .2s;
    }
    .btn-remove:hover { color: #FF6B6B; }

    .btn-start {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      color: #1a0a00;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: .5px;
      transition: transform .2s, box-shadow .2s;
    }
    .btn-start:disabled {
      background: rgba(255,255,255,.1);
      color: rgba(255,255,255,.28);
      cursor: not-allowed;
    }
    .btn-start:not(:disabled):hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(255,215,0,.4);
    }

    /* ── race screen ── */
    #raceCanvas { display: block; }

    .countdown-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.72);
      z-index: 200;
    }
    .countdown-overlay.hidden { display: none; }

    .countdown-text {
      font-weight: 900;
      text-align: center;
      line-height: 1;
      user-select: none;
    }
    .countdown-text.num {
      font-size: min(35vw, 220px);
      color: #FFD700;
      text-shadow: 0 0 50px rgba(255,215,0,.7), 5px 5px 0 rgba(0,0,0,.5);
      animation: popIn .7s ease-out forwards;
    }
    .countdown-text.go {
      font-size: min(25vw, 160px);
      color: #6BCB77;
      text-shadow: 0 0 50px rgba(107,203,119,.8), 5px 5px 0 rgba(0,0,0,.5);
      animation: goPop .55s ease-out forwards;
    }

    @keyframes popIn {
      0%   { transform: scale(.2); opacity: 0; }
      60%  { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes goPop {
      0%   { transform: scale(.2) rotate(-12deg); opacity: 0; }
      55%  { transform: scale(1.35) rotate(6deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    /* ── winner screen ── */
    .winner-crown { font-size: 4rem; animation: crownBob 1.1s ease-in-out infinite alternate; }
    @keyframes crownBob {
      from { transform: translateY(0) rotate(-6deg); }
      to   { transform: translateY(-14px) rotate(6deg); }
    }

    .winner-headline {
      margin-top: 10px;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #FFD700;
      text-shadow: 2px 2px 6px rgba(0,0,0,.6);
      text-align: center;
    }

    #winnerName {
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 900;
      margin: 10px 0 4px;
      text-align: center;
    }

    .winner-canvas-wrap {
      margin: 18px auto 0;
      border-radius: 14px;
      overflow: hidden;
      border: 3px solid rgba(255,215,0,.45);
      background: rgba(255,255,255,.05);
    }

    #winnerCanvas { display: block; }

    .btn-reset {
      margin-top: 28px;
      padding: 15px 44px;
      background: linear-gradient(135deg, #6BCB77, #4D96FF);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      letter-spacing: .5px;
    }
    .btn-reset:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(77,150,255,.45);
    }

    /* ── confetti canvas ── */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }
  </style>
</head>
<body>

<!-- ═══════════════════════ SETUP SCREEN ═══════════════════════ -->
<div id="setup-screen" class="screen active">
  <h1 class="game-title">🥔 Potato Race! 🥔</h1>
  <p class="game-subtitle">Add 2–12 contestants, then start the race!</p>

  <div class="setup-box">
    <div class="add-row">
      <input
        type="text"
        id="contestantInput"
        class="contestant-input"
        placeholder="Enter contestant name…"
        maxlength="18"
        autocomplete="off"
      />
      <button class="btn-add" id="btnAdd">Add</button>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <div class="contestant-count" id="contestantCount">0 / 12 contestants added</div>
    <ul class="contestant-list" id="contestantList"></ul>
    <button class="btn-start" id="btnStart" disabled>🏁 Start Race! 🏁</button>
  </div>
</div>

<!-- ═══════════════════════ RACE SCREEN ═══════════════════════ -->
<div id="race-screen" class="screen">
  <canvas id="raceCanvas"></canvas>
  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-text num" id="countdownText">3</div>
  </div>
</div>

<!-- ═══════════════════════ WINNER SCREEN ═══════════════════════ -->
<div id="winner-screen" class="screen">
  <div class="winner-crown">🏆</div>
  <div class="winner-headline">🎉 We Have a Winner! 🎉</div>
  <div id="winnerName"></div>
  <div class="winner-canvas-wrap">
    <canvas id="winnerCanvas" width="260" height="200"></canvas>
  </div>
  <button class="btn-reset" id="btnReset">🔄 Race Again!</button>
</div>

<!-- confetti layer -->
<canvas id="confettiCanvas"></canvas>

<script>
// ================================================================
//  CONSTANTS
// ================================================================
const COLORS = [
  '#FF6B6B','#4ECDC4','#FFD93D','#6BCB77',
  '#4D96FF','#FF9F1C','#C77DFF','#FF6FC8',
  '#48CAE4','#F4A261','#52B788','#E63946'
];
const MAX = 12;
const LANE_H = 96;              // px per lane on the racetrack
const START_X = 130;            // x where racers begin
const FINISH_OFFSET = 80;       // gap from right edge to finish line

// Race balance tuning
const BOOST_MIN_MULT   = 1.6;   // minimum speed multiplier during a boost
const BOOST_RANGE      = 2.4;   // added random range on top of BOOST_MIN_MULT (max = 4×)
const STUMBLE_MIN_MULT = 0.25;  // minimum speed multiplier during a stumble
const STUMBLE_RANGE    = 0.25;  // added random range (max stumble = 0.5×)
const MOVEMENT_JITTER  = 0.4;   // random per-frame speed noise (px)

// ================================================================
//  STATE
// ================================================================
let contestants = [];       // { name, color }
let racers = [];            // runtime objects during a race
let winner = null;
let rafId = null;
let frameCount = 0;
let racing = false;
let confettiParticles = [];
let confettiRaf = null;

// ================================================================
//  UTILITY
// ================================================================
function esc(str) {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ================================================================
//  SETUP PHASE
// ================================================================
function addContestant() {
  const input = document.getElementById('contestantInput');
  const errEl = document.getElementById('errorMsg');
  const name = input.value.trim();
  errEl.textContent = '';

  if (!name) { errEl.textContent = 'Please enter a name.'; return; }
  if (contestants.length >= MAX) { errEl.textContent = `Max ${MAX} contestants.`; return; }
  if (contestants.some(c => c.name.toLowerCase() === name.toLowerCase())) {
    errEl.textContent = 'Name already taken!'; return;
  }

  contestants.push({ name, color: COLORS[contestants.length] });
  input.value = '';
  input.focus();
  renderSetup();
}

function removeContestant(i) {
  contestants.splice(i, 1);
  contestants.forEach((c, idx) => { c.color = COLORS[idx]; });
  renderSetup();
}

function renderSetup() {
  document.getElementById('contestantCount').textContent =
    `${contestants.length} / ${MAX} contestants added`;

  const ul = document.getElementById('contestantList');
  ul.innerHTML = contestants.map((c, i) => `
    <li class="contestant-item">
      <div class="color-dot" style="background:${c.color}"></div>
      <span class="contestant-label">${esc(c.name)}</span>
      <button class="btn-remove" data-i="${i}" title="Remove">✕</button>
    </li>`).join('');

  ul.querySelectorAll('.btn-remove').forEach(btn =>
    btn.addEventListener('click', () => removeContestant(+btn.dataset.i))
  );

  document.getElementById('btnStart').disabled = contestants.length < 2;
}

document.getElementById('btnAdd').addEventListener('click', addContestant);
document.getElementById('contestantInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addContestant();
});
document.getElementById('btnStart').addEventListener('click', startRace);
document.getElementById('btnReset').addEventListener('click', resetGame);

// ================================================================
//  RACE INITIALISATION
// ================================================================
function startRace() {
  showScreen('race-screen');

  const canvas = document.getElementById('raceCanvas');
  canvas.width  = window.innerWidth;
  canvas.height = LANE_H * contestants.length;

  racers = contestants.map((c, i) => ({
    name: c.name,
    color: c.color,
    lane: i,
    x: START_X,
    baseSpeed: 1.8 + Math.random() * 1.8,   // px/frame
    boostMult: 1,
    boostFrames: 0,
    nextBoost: randInt(30, 80),
    bobPhase: Math.random() * Math.PI * 2,
    finished: false,
  }));

  winner = null;
  racing = false;
  frameCount = 0;

  // draw the static starting frame
  drawFrame();
  runCountdown();
}

// ================================================================
//  COUNTDOWN
// ================================================================
function runCountdown() {
  const overlay = document.getElementById('countdownOverlay');
  const textEl  = document.getElementById('countdownText');
  overlay.classList.remove('hidden');

  const steps = ['3','2','1','GO!'];
  let step = 0;

  function tick() {
    if (step >= steps.length) {
      overlay.classList.add('hidden');
      racing = true;
      rafId = requestAnimationFrame(raceLoop);
      return;
    }
    const isGo = step === 3;
    textEl.className = 'countdown-text ' + (isGo ? 'go' : 'num');
    // restart CSS animation
    textEl.style.animation = 'none';
    // eslint-disable-next-line no-unused-expressions
    textEl.offsetHeight; // force reflow
    textEl.style.animation = '';
    textEl.textContent = steps[step];
    step++;
    setTimeout(tick, isGo ? 700 : 850);
  }
  tick();
}

// ================================================================
//  RACE LOOP
// ================================================================
function raceLoop() {
  if (!racing) return;
  frameCount++;
  updateRacers();
  drawFrame();
  if (!winner) {
    rafId = requestAnimationFrame(raceLoop);
  } else {
    setTimeout(() => presentWinner(winner), 900);
  }
}

function updateRacers() {
  const finishX = document.getElementById('raceCanvas').width - FINISH_OFFSET;

  racers.forEach(r => {
    if (r.finished) return;

    // ── boost logic ──────────────────────────────────────────────
    r.nextBoost--;
    if (r.nextBoost <= 0) {
      r.boostMult   = BOOST_MIN_MULT + Math.random() * BOOST_RANGE;  // BOOST_MIN_MULT – 4×
      r.boostFrames = randInt(12, 30);
      r.nextBoost   = randInt(40, 100);
    }
    if (r.boostFrames > 0) {
      r.boostFrames--;
    } else {
      r.boostMult = 1;
    }

    // ── occasional stumble ───────────────────────────────────────
    if (Math.random() < 0.004) {
      r.boostMult   = STUMBLE_MIN_MULT + Math.random() * STUMBLE_RANGE;  // slow way down
      r.boostFrames = randInt(8, 18);
    }

    // ── move ─────────────────────────────────────────────────────
    r.x += (r.baseSpeed * r.boostMult) + (Math.random() * MOVEMENT_JITTER);

    // ── finish check ─────────────────────────────────────────────
    if (r.x >= finishX && !winner) {
      r.finished = true;
      winner = r;
    }
  });
}

// ================================================================
//  DRAWING
// ================================================================
function drawFrame() {
  const canvas = document.getElementById('raceCanvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const finishX = W - FINISH_OFFSET;

  ctx.clearRect(0, 0, W, H);

  // ── lanes ─────────────────────────────────────────────────────
  racers.forEach((r, i) => {
    const y = i * LANE_H;

    // alternating grass tone
    ctx.fillStyle = i % 2 === 0 ? '#152b15' : '#112511';
    ctx.fillRect(0, y, W, LANE_H);

    // left info panel
    ctx.fillStyle = r.color + '28';
    ctx.fillRect(0, y, START_X - 10, LANE_H);

    // dotted lane divider
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.lineWidth = 1;
    ctx.setLineDash([12, 8]);
    ctx.beginPath();
    ctx.moveTo(START_X - 10, y + LANE_H);
    ctx.lineTo(finishX, y + LANE_H);
    ctx.stroke();
    ctx.restore();
  });

  // ── start line ────────────────────────────────────────────────
  ctx.strokeStyle = 'rgba(255,255,255,.6)';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(START_X - 10, 0);
  ctx.lineTo(START_X - 10, H);
  ctx.stroke();

  // ── finish line (checkered) ────────────────────────────────────
  const tile = 16;
  const cols = 2;
  const rows = Math.ceil(H / tile);
  for (let row = 0; row < rows; row++) {
    for (let col = 0; col < cols; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? '#fff' : '#000';
      ctx.fillRect(finishX + col * tile, row * tile, tile, tile);
    }
  }

  // FINISH label
  ctx.save();
  ctx.translate(finishX + tile * cols + 2, H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 13px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('FINISH', 0, 0);
  ctx.restore();

  // ── left-panel labels ─────────────────────────────────────────
  racers.forEach((r, i) => {
    const cy = i * LANE_H + LANE_H / 2;

    ctx.beginPath();
    ctx.arc(22, cy, 13, 0, Math.PI * 2);
    ctx.fillStyle = r.color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 13px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    const label = r.name.length > 9 ? r.name.slice(0, 8) + '…' : r.name;
    ctx.fillText(label, 40, cy);
  });

  // ── racers ────────────────────────────────────────────────────
  racers.forEach(r => {
    const cy = r.lane * LANE_H + LANE_H / 2;
    const bob = Math.sin(frameCount * 0.28 + r.bobPhase) * 3.5;
    drawPotato(ctx, r.x, cy + bob, r.color, r.boostMult > 1.2, r.boostMult < 0.5);
  });
}

// ================================================================
//  POTATO RACER DRAWING
// ================================================================
function drawPotato(ctx, x, y, color, boosting, stumbling) {
  ctx.save();
  ctx.translate(x, y);

  // ── boost flames ────────────────────────────────────────────
  if (boosting) {
    const flameColors = ['#FF3300CC','#FF8C00CC','#FFD700CC'];
    flameColors.forEach((fc, fi) => {
      ctx.fillStyle = fc;
      ctx.beginPath();
      ctx.ellipse(
        -42 - fi * 10 + (Math.random() - .5) * 4,
        (fi - 1) * 5,
        13 - fi * 2, 5, 0, 0, Math.PI * 2
      );
      ctx.fill();
    });
  }

  // ── stumble sparks ──────────────────────────────────────────
  if (stumbling) {
    ctx.fillStyle = '#FF6B6B';
    for (let s = 0; s < 4; s++) {
      ctx.beginPath();
      ctx.arc(
        -30 + (Math.random() - .5) * 20,
        -20 + (Math.random() - .5) * 20,
        3, 0, Math.PI * 2
      );
      ctx.fill();
    }
  }

  // ── wheels ──────────────────────────────────────────────────
  drawWheel(ctx, -22, 18, 11, color, frameCount * 0.22);
  drawWheel(ctx,  22, 18, 11, color, frameCount * 0.22);

  // ── potato body ─────────────────────────────────────────────
  ctx.fillStyle = '#A0785A';
  ctx.beginPath();
  ctx.ellipse(0, 2, 37, 21, 0, 0, Math.PI * 2);
  ctx.fill();

  // highlight
  ctx.fillStyle = '#C49A6E';
  ctx.beginPath();
  ctx.ellipse(-9, -5, 14, 9, -0.3, 0, Math.PI * 2);
  ctx.fill();

  // spots
  ctx.fillStyle = '#7A5C3A';
  [[-16, 2, 3],[-5, 8, 2],[10, 4, 2]].forEach(([sx, sy, sr]) => {
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
  });

  // ── saddle ──────────────────────────────────────────────────
  ctx.fillStyle = color;
  roundRect(ctx, -12, -20, 24, 14, 4);
  ctx.fill();

  // ── jockey body ─────────────────────────────────────────────
  ctx.fillStyle = color;
  roundRect(ctx, -5, -36, 10, 18, 3);
  ctx.fill();

  // ── jockey head ─────────────────────────────────────────────
  ctx.fillStyle = '#FFD5B0';
  ctx.beginPath();
  ctx.arc(0, -42, 8, 0, Math.PI * 2);
  ctx.fill();

  // ── jockey hat brim ─────────────────────────────────────────
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, -48, 12, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  roundRect(ctx, -7, -60, 14, 14, 3);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(0, -60, 6, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── reins ───────────────────────────────────────────────────
  ctx.strokeStyle = '#8B6347';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(5, -38);
  ctx.quadraticCurveTo(22, -22, 16, -4);
  ctx.stroke();

  ctx.restore();
}

function drawWheel(ctx, x, y, r, color, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);

  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, 0, r * .44, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(Math.cos(a) * r * .88, Math.sin(a) * r * .88);
    ctx.stroke();
  }
  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
  } else {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
}

// ================================================================
//  WINNER SCREEN
// ================================================================
function presentWinner(w) {
  showScreen('winner-screen');

  const nameEl = document.getElementById('winnerName');
  nameEl.textContent = w.name;
  nameEl.style.color = w.color;

  // draw big potato on winner canvas
  const wc  = document.getElementById('winnerCanvas');
  const ctx = wc.getContext('2d');
  ctx.clearRect(0, 0, wc.width, wc.height);
  // background circle
  ctx.fillStyle = w.color + '22';
  ctx.beginPath();
  ctx.arc(wc.width / 2, wc.height / 2 + 20, 80, 0, Math.PI * 2);
  ctx.fill();
  // draw potato at 1.8× scale
  ctx.save();
  ctx.translate(wc.width / 2, wc.height / 2 + 30);
  ctx.scale(1.8, 1.8);
  drawPotato(ctx, 0, 0, w.color, false, false);
  ctx.restore();

  startConfetti();
}

// ================================================================
//  CONFETTI
// ================================================================
function startConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  confettiParticles = Array.from({ length: 180 }, () => ({
    x:  Math.random() * canvas.width,
    y:  Math.random() * canvas.height - canvas.height,
    vx: (Math.random() - .5) * 3.5,
    vy: 1.8 + Math.random() * 3,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    w:  6 + Math.random() * 9,
    h:  4 + Math.random() * 5,
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() - .5) * .18,
  }));
  if (confettiRaf) cancelAnimationFrame(confettiRaf);
  animConfetti();
}

function animConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx    = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  confettiParticles.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
    p.x += p.vx; p.y += p.vy; p.rot += p.rotV;
    if (p.y > canvas.height) { p.y = -10; p.x = Math.random() * canvas.width; }
  });

  if (document.getElementById('winner-screen').classList.contains('active')) {
    confettiRaf = requestAnimationFrame(animConfetti);
  }
}

// ================================================================
//  RESET
// ================================================================
function resetGame() {
  racing = false;
  if (rafId)        { cancelAnimationFrame(rafId);        rafId = null; }
  if (confettiRaf)  { cancelAnimationFrame(confettiRaf);  confettiRaf = null; }

  // clear confetti canvas
  const cc = document.getElementById('confettiCanvas');
  cc.getContext('2d').clearRect(0, 0, cc.width, cc.height);

  contestants = [];
  racers = [];
  winner = null;
  frameCount = 0;

  renderSetup();
  showScreen('setup-screen');
  document.getElementById('contestantInput').focus();
}

// ================================================================
//  HELPERS
// ================================================================
function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}
